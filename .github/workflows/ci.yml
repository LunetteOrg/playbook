name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # PLAYBOOK_SMOKE packs every package and runs the published bins from a real
      # node_modules (packages/create-playbook/test/installed.test.ts).
      - run: pnpm test
        env:
          PLAYBOOK_SMOKE: '1'
